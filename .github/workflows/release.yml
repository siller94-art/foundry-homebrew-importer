name: Release

# Publishing a GitHub release tagged vX.Y.Z builds the module zip and attaches it,
# together with a module.json whose version and download URL match that tag.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version and download URL into module.json
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          jq --arg v "$VERSION" \
             --arg d "https://github.com/$REPO/releases/download/$TAG/homebrew-importer.zip" \
             --arg m "https://github.com/$REPO/releases/latest/download/module.json" \
             '.version=$v | .download=$d | .manifest=$m' module.json > module.tmp && mv module.tmp module.json

      - name: Build zip
        run: zip -r homebrew-importer.zip module.json README.md LICENSE scripts styles examples

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" module.json homebrew-importer.zip --clobber
